name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci_password_123
      JWT_ACCESS_SECRET: ci-access-secret-0123456789-abcdefghijklmnop
      DATA_ENCRYPTION_KEY: ci-encryption-key-0123456789-abcdefghijklmnop
      WEB_PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Wait for the site
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Smoke test through Nginx
        run: |
          curl -fsS http://localhost:8080/healthz
          status=$(curl -s -o /tmp/register.json -w '%{http_code}' -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI User","email":"ci@example.com","password":"CiPassw0rd1"}')
          test "$status" = "201"
          token=$(jq -r .accessToken /tmp/register.json)
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/students \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"Smoke Test","rollNumber":"S-1","batch":"2026","course":"CSE","email":"smoke@example.com"}')
          test "$status" = "201"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set, skipping (Render can also auto-deploy from GitHub)."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
